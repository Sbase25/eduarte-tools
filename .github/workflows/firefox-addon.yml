name: Publish Firefox add-on

# Publiceert naar addons.mozilla.org zodra er naar de branch "firefox" wordt gepusht.
# Werkwijze: merge main in firefox (git checkout firefox && git merge main && git push).
# Verhoog eerst de versie in manifest.json: AMO weigert een versie die al bestaat.
on:
  push:
    branches: [firefox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            popup-app/package-lock.json

      - name: Install root dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Build popup
        working-directory: popup-app
        run: |
          npm ci
          npm run build

      - name: Build Firefox extension
        run: node scripts/build-firefox.mjs

      - name: Create source code archive for Mozilla review
        run: git archive --format=zip -o dist/source.zip HEAD

      - name: Lint with web-ext
        run: npx --yes web-ext@8 lint --source-dir dist/firefox

      - name: Submit to addons.mozilla.org (listed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/artifacts \
            --channel listed \
            --upload-source-code dist/source.zip \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
