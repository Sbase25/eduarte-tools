name: Publish Chrome extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Go instellen
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Manifest controleren
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json, re; v=json.load(open("manifest.json"))["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v), v; print("Versie:", v)'

      - name: Extensie klaarmaken
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extension-package
          mkdir -p extension-package
          cp manifest.json background.js content.js overlay.js popup.html popup.js theme.js extension-package/
          cp -R icons assets extension-package/

      - name: cws installeren
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/tanema/cws@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Publiceren naar Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cws deploy extension-package
