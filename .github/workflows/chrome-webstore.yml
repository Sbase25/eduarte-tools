name: Publish Chrome extension

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "background.js"
      - "content.js"
      - "overlay.js"
      - "location-tracker.html"
      - "location-tracker.js"
      - "popup-dist/**"
      - "theme.js"
      - "icons/**"
      - "assets/**"
      - ".github/workflows/chrome-webstore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json, re; version=json.load(open("manifest.json"))["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), version; print(version)'

      - name: Prepare extension package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extension-package extension.zip
          mkdir -p extension-package
          cp manifest.json background.js content.js overlay.js theme.js location-tracker.html location-tracker.js extension-package/
          cp -R icons assets popup-dist extension-package/
          (cd extension-package && zip -q -r ../extension.zip .)

      - name: Get Google access token
        id: token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          token="$(jq -r '.access_token // empty' <<< "$response")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Upload extension
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.value }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload"

      - name: Publish extension
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.value }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish"
