name: Publish Chrome extension

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "background.js"
      - "content.js"
      - "overlay.js"
      - "popup.html"
      - "popup.js"
      - "theme.js"
      - "icons/**"
      - "assets/**"
      - ".github/workflows/chrome-webstore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("manifest.json","utf8")); if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error("Invalid manifest version"); console.log(m.version);'

      - name: Install cws
        run: npm install --global cws

      - name: Publish to Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: cws deploy .
